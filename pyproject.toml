[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surucucu"
version = "0.1.0"
description = "High-performance Glassmorphic AI, GPU (VRAM/CUDA), Docker & System Observability HUD for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Erik" }
]
keywords = [
    "gpu",
    "nvidia",
    "vram",
    "cuda",
    "docker",
    "ai",
    "llm",
    "monitoring",
    "hud",
    "linux",
    "gtk",
    "surucucu"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "PyGObject>=3.36.0",
]

[project.scripts]
surucucu = "surucucu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surucucu = ["assets/*"]
